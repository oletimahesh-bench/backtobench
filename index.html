<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackToBench.in - Alumni & Teachers Network</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">BackToBench.in</h1>
            <div id="authStatus" class="text-sm bg-blue-700 px-3 py-1 rounded-full">లాగిన్ అవ్వండి</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- 1. Authentication Section (Mobile Number & PIN) -->
        <section id="authSection" class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">మొబైల్ నెంబర్ & పిన్ లాగిన్ (Login / Register)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">మొబైల్ నెంబర్ (Mobile Number)</label>
                    <input type="tel" id="loginMobile" placeholder="10 అంకెల నెంబర్" class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">4-అంకెల పిన్ (4-Digit PIN)</label>
                    <input type="password" id="loginPin" maxlength="4" placeholder="••••" class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <button id="loginBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 font-semibold transition">
                    లాగిన్ / రిజిస్టర్ అవ్వండి
                </button>
            </div>
        </section>

        <!-- 2. Profile Registration Form (Hidden until login) -->
        <section id="profileSection" class="bg-white p-6 rounded-xl shadow-md mb-8 hidden">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">మీ ప్రొఫైల్ వివరాలు నింపండి (Add Profile)</h2>
            <form id="profileForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">పూర్తి పేరు (Full Name)</label>
                    <input type="text" id="fullName" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ప్రొఫైల్ రకం (Profile Type)</label>
                    <select id="profileType" class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                        <option value="Student">విద్యార్థి (Student)</option>
                        <option value="Teacher">ఉపాధ్యాయులు (Teacher)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">సంస్థ రకం (Institution Type)</label>
                    <select id="instType" class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                        <option value="School">పాఠశాల (School)</option>
                        <option value="College">కాలేజీ (College)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">పాఠశాల / కాలేజీ పేరు (School/College Name)</label>
                    <input type="text" id="instName" required placeholder="ఉదా: ZP High School, Peddamatlapudi" class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">పాస్ అవుట్ ఇయర్ / బ్యాచ్ (Batch Year)</label>
                    <input type="number" id="batchYear" required placeholder="ఉదా: 2015" class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 font-semibold transition">
                    ప్రొఫైల్ సేవ్ చేయండి (Save Profile)
                </button>
            </form>
        </section>

        <!-- 3. Filter & Directory Section -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">అలమ్ని & టీచర్స్ డైరెక్టరీ (Directory & Filters)</h2>
            
            <!-- Filters -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">సంస్థ పేరుతో వెతకండి (Filter by School/College)</label>
                    <input type="text" id="filterInst" placeholder="స్కూల్ పేరు టైప్ చేయండి..." class="w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">బ్యాచ్ ఇయర్ (Filter by Batch)</label>
                    <input type="number" id="filterBatch" placeholder="ఇయర్ టైప్ చేయండి..." class="w-full p-2 border border-gray-300 rounded-lg">
                </div>
            </div>

            <!-- Profiles List -->
            <div id="profilesList" class="space-y-3">
                <p class="text-gray-500">డేటా లోడ్ అవుతోంది...</p>
            </div>
        </section>

    </main>

    <!-- Firebase SDKs and App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzqeZKiGa_LfGOpG40dInYWiogBb1DH9w",
          authDomain: "backtobench.firebaseapp.com",
          projectId: "backtobench",
          storageBucket: "backtobench.firebasestorage.app",
          messagingSenderId: "487546396625",
          appId: "1:487546396625:web:04408ed568b91c63ce8af0",
          measurementId: "G-L9CLEB0CZE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUserMobile = null;

        // Login Handler
        document.getElementById('loginBtn').addEventListener('click', () => {
            const mobile = document.getElementById('loginMobile').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            if (mobile.length !== 10 || pin.length !== 4) {
                alert('దయచేసి సరైన 10 అంకెల మొబైల్ నెంబర్ మరియు 4-అంకెల పిన్ ఇవ్వండి బాబాయ్!');
                return;
            }

            currentUserMobile = mobile;
            document.getElementById('authStatus').innerText = `లాగిన్ అయ్యారు: ${mobile}`;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('profileSection').classList.remove('hidden');
            alert('లాగిన్ విజయవంతమైంది! ఇప్పుడు మీ ప్రొఫైల్ వివరాలు నింపండి.');
        });

        // Save Profile Handler
        const profileForm = document.getElementById('profileForm');
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const profileType = document.getElementById('profileType').value;
            const instType = document.getElementById('instType').value;
            const instName = document.getElementById('instName').value;
            const batchYear = document.getElementById('batchYear').value;

            try {
                await addDoc(collection(db, "profiles"), {
                    mobile: currentUserMobile,
                    fullName,
                    profileType,
                    instType,
                    instName: instName.toLowerCase(),
                    batchYear: Number(batchYear),
                    createdAt: new Date()
                });
                alert('ప్రొఫైల్ విజయవంతంగా సేవ్ అయింది బాబాయ్!');
                profileForm.reset();
                loadProfiles();
            } catch (error) {
                console.error("Error saving profile: ", error);
                alert('సేవ్ చేయడంలో లోపం ఏర్పడింది.');
            }
        });

        // Load and Filter Profiles
        async function loadProfiles() {
            const listContainer = document.getElementById('profilesList');
            listContainer.innerHTML = '<p class="text-gray-500">లోడ్ అవుతోంది...</p>';
            
            const filterInst = document.getElementById('filterInst').value.trim().toLowerCase();
            const filterBatch = document.getElementById('filterBatch').value.trim();

            try {
                const querySnapshot = await getDocs(collection(db, "profiles"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-gray-500">ఇప్పటివరకు ఎవరూ నమోదు చేయలేదు.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                let count = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Filtering logic
                    if (filterInst && !data.instName.includes(filterInst)) return;
                    if (filterBatch && data.batchYear != filterBatch) return;

                    count++;
                    listContainer.innerHTML += `
                        <div class="p-4 border border-gray-200 rounded-lg bg-gray-50 flex justify-between items-center shadow-sm">
                            <div>
                                <h3 class="font-bold text-lg text-blue-800">${data.fullName} <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">${data.profileType}</span></h3>
                                <p class="text-sm text-gray-600">సంస్థ: <strong>${data.instName}</strong> (${data.instType}) | బ్యాచ్: <strong>${data.batchYear}</strong></p>
                            </div>
                        </div>
                    `;
                });

                if (count === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500">మీరు వెతికిన వివరాలకు సరిపోయే ప్రొఫైల్స్ ఏవీ లేవు.</p>';
                }
            } catch (error) {
                console.error("Error loading profiles: ", error);
                listContainer.innerHTML = '<p class="text-red-500">డేటా లోడ్ చేయడంలో విఫలమైంది.</p>';
            }
        }

        // Event listeners for filters
        document.getElementById('filterInst').addEventListener('input', loadProfiles);
        document.getElementById('filterBatch').addEventListener('input', loadProfiles);

        // Initial load
        loadProfiles();
    </script>
</body>
</html>
