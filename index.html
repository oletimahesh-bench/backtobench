<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackToBench.in - Alumni & Teachers Network</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">BackToBench.in</h1>
            <p class="text-sm bg-blue-700 px-3 py-1 rounded-full">Alumni & Community Network</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Form to Add Profile -->
        <section class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">మీ వివరాలు జోడించండి (Add Profile)</h2>
            <form id="profileForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">పూర్తి పేరు (Full Name)</label>
                    <input type="text" id="name" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">పాఠశాల / కాలేజీ పేరు (School/College)</label>
                    <input type="text" id="school" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">పాస్ అవుట్ ఇయర్ (Batch Year)</label>
                    <input type="number" id="batch" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 font-semibold transition">
                    సేవ్ చేయండి (Save Profile)
                </button>
            </form>
        </section>

        <!-- Profiles List Section -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">అలమ్ని జాబితా (Alumni Directory)</h2>
            <div id="profilesList" class="space-y-3">
                <p class="text-gray-500">డేటా లోడ్ అవుతోంది...</p>
            </div>
        </section>

    </main>

    <!-- Firebase SDKs and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // నీ ఫైర్‌బేస్ కాన్ఫిగర్ కీస్
        const firebaseConfig = {
          apiKey: "AIzaSyDzqeZKiGa_LfGOpG40dInYWiogBb1DH9w",
          authDomain: "backtobench.firebaseapp.com",
          projectId: "backtobench",
          storageBucket: "backtobench.firebasestorage.app",
          messagingSenderId: "487546396625",
          appId: "1:487546396625:web:04408ed568b91c63ce8af0",
          measurementId: "G-L9CLEB0CZE"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Form Submit Handler (Saving data to Firestore)
        const form = document.getElementById('profileForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const school = document.getElementById('school').value;
            const batch = document.getElementById('batch').value;

            try {
                await addDoc(collection(db, "profiles"), {
                    name: name,
                    school: school,
                    batch: batch,
                    createdAt: new Date()
                });
                alert('ప్రొఫైల్ విజయవంతంగా సేవ్ అయింది బాబాయ్!');
                form.reset();
                loadProfiles();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert('సేవ్ చేయడంలో లోపం ఏర్పడింది.');
            }
        });

        // Load Profiles from Firestore
        async function loadProfiles() {
            const listContainer = document.getElementById('profilesList');
            listContainer.innerHTML = '<p class="text-gray-500">లోడ్ అవుతోంది...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "profiles"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-gray-500">ఇప్పటివరకు ఎవరూ నమోదు చేయలేదు.</p>';
                    return;
                }
                listContainer.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    listContainer.innerHTML += `
                        <div class="p-4 border border-gray-200 rounded-lg bg-gray-50 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-lg text-gray-800">${data.name}</h3>
                                <p class="text-sm text-gray-600">పాఠశాల: ${data.school} | బ్యాచ్: ${data.batch}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading documents: ", error);
                listContainer.innerHTML = '<p class="text-red-500">డేటా లోడ్ చేయడంలో విఫలమైంది.</p>';
            }
        }

        // Page load అయిన వెంటనే డేటా లోడ్ అవ్వడానికి
        loadProfiles();
    </script>
</body>
</html>
