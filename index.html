<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackToBench.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">BackToBench.in</h1>
            <div id="authStatus" class="text-sm bg-blue-700 px-3 py-1 rounded-full">Please Login</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Login Section -->
        <section id="authSection" class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">Login / Register</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mobile Number</label>
                    <input type="tel" id="loginMobile" placeholder="10-digit number" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">4-Digit PIN</label>
                    <input type="password" id="loginPin" maxlength="4" placeholder="••••" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <button id="loginBtn" class="w-full bg-blue-600 text-white py-2.5 px-4 rounded-lg hover:bg-blue-700 font-semibold">
                    Login / Continue
                </button>
            </div>
        </section>

        <!-- Profile Form Section -->
        <section id="profileSection" class="bg-white p-6 rounded-xl shadow-md mb-8 hidden">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">Add Your Profile</h2>
            <form id="profileForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="fullName" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Profile Type</label>
                    <select id="profileType" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg">
                        <option value="Student">Student</option>
                        <option value="Teacher">Teacher</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Institution Name (School/College)</label>
                    <input type="text" id="instName" required placeholder="e.g. ZP High School" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Batch Year</label>
                    <input type="number" id="batchYear" required placeholder="e.g. 2006" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2.5 px-4 rounded-lg hover:bg-green-700 font-semibold">
                    Save Profile
                </button>
            </form>
        </section>

        <!-- Directory Section -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-blue-600">Alumni Directory</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <input type="text" id="filterInst" placeholder="Search by School/College..." class="w-full p-2.5 border border-gray-300 rounded-lg">
                <input type="number" id="filterBatch" placeholder="Search by Batch Year..." class="w-full p-2.5 border border-gray-300 rounded-lg">
            </div>
            <div id="profilesList" class="space-y-3">
                <p class="text-gray-500">Loading data...</p>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzqeZKiGa_LfGOpG40dInYWiogBb1DH9w",
          authDomain: "backtobench.firebaseapp.com",
          projectId: "backtobench",
          storageBucket: "backtobench.firebasestorage.app",
          messagingSenderId: "487546396625",
          appId: "1:487546396625:web:04408ed568b91c63ce8af0",
          measurementId: "G-L9CLEB0CZE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUserMobile = null;

        document.getElementById('loginBtn').addEventListener('click', () => {
            const mobile = document.getElementById('loginMobile').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            if (mobile.length !== 10 || pin.length !== 4) {
                alert('Please enter valid 10-digit mobile and 4-digit PIN.');
                return;
            }

            currentUserMobile = mobile;
            document.getElementById('authStatus').innerText = `Logged in: ${mobile}`;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('profileSection').classList.remove('hidden');
        });

        const profileForm = document.getElementById('profileForm');
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const profileType = document.getElementById('profileType').value;
            const instName = document.getElementById('instName').value.trim();
            const batchYear = document.getElementById('batchYear').value.trim();

            try {
                await addDoc(collection(db, "profiles"), {
                    mobile: currentUserMobile,
                    fullName,
                    profileType,
                    instName: instName.toLowerCase(),
                    originalInst: instName,
                    batchYear: Number(batchYear),
                    createdAt: new Date()
                });
                alert('Profile saved successfully!');
                profileForm.reset();
                loadProfiles();
            } catch (error) {
                console.error("Error saving:", error);
                alert('Failed to save profile.');
            }
        });

        async function loadProfiles() {
            const listContainer = document.getElementById('profilesList');
            listContainer.innerHTML = '<p class="text-gray-500">Loading...</p>';
            
            const filterInst = document.getElementById('filterInst').value.trim().toLowerCase();
            const filterBatch = document.getElementById('filterBatch').value.trim();

            try {
                const querySnapshot = await getDocs(collection(db, "profiles"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-gray-500">No profiles found.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                let count = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (filterInst && !data.instName.includes(filterInst)) return;
                    if (filterBatch && data.batchYear != filterBatch) return;

                    count++;
                    listContainer.innerHTML += `
                        <div class="p-4 border rounded-lg bg-gray-50 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-lg text-blue-800">${data.fullName} <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">${data.profileType}</span></h3>
                                <p class="text-sm text-gray-600">Institution: ${data.originalInst || data.instName} | Batch: ${data.batchYear}</p>
                            </div>
                        </div>
                    `;
                });

                if (count === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500">No matching profiles.</p>';
                }
            } catch (error) {
                console.error("Error loading:", error);
                listContainer.innerHTML = '<p class="text-red-500">Error loading data.</p>';
            }
        }

        document.getElementById('filterInst').addEventListener('input', loadProfiles);
        document.getElementById('filterBatch').addEventListener('input', loadProfiles);

        loadProfiles();
    </script>
</body>
</html>
